    <link
      rel="preload"
      href="/fonts/nunito-sans-variable.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <script>
      (() => {
        const theme = localStorage.getItem("edutools-theme");
        const resolved = theme === "dark" || theme === "light" ? theme : (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        document.documentElement.classList.toggle("dark", resolved === "dark");
        document.documentElement.style.colorScheme = resolved;
        document.querySelector('meta[name="color-scheme"]').setAttribute("content", resolved);
        document.querySelector('meta[name="theme-color"]').setAttribute("content", resolved === "dark" ? "#111827" : "#4f46e5");
      })();
    </script>
